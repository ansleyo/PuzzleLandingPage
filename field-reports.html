<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Reports</title>
  <style>
    :root {
      --paper: rgba(255, 252, 247, 0.92);
      --paper-border: rgba(114, 95, 62, 0.2);
      --ink: #243330;
      --muted: #5f726f;
      --pine: #3f6b63;
      --lake: #7fb4bc;
      --sun: #e8c77a;
      --shadow: rgba(32, 45, 42, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.5), transparent 24%),
        radial-gradient(circle at 86% 12%, rgba(232, 199, 122, 0.32), transparent 20%),
        linear-gradient(180deg, #eef1df 0%, #dbeaf0 42%, #9ebfc3 100%);
    }

    .scene {
      min-height: 100vh;
      padding: 28px 18px 22px;
      position: relative;
      overflow: hidden;
    }

    .scene::before,
    .scene::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
    }

    .scene::before {
      left: -8vw;
      bottom: -10vh;
      width: 42vw;
      height: 34vh;
      background: linear-gradient(180deg, rgba(57, 94, 88, 0.2), rgba(42, 80, 72, 0.72));
      clip-path: polygon(0 100%, 0 48%, 22% 60%, 38% 34%, 54% 56%, 72% 24%, 88% 46%, 100% 30%, 100% 100%);
    }

    .scene::after {
      right: -6vw;
      top: -2vh;
      width: 28vw;
      height: 22vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 248, 219, 0.95) 0%, rgba(255, 248, 219, 0.16) 58%, transparent 70%);
      filter: blur(6px);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 22px;
      border-radius: 30px;
      background: var(--paper);
      border: 1px solid var(--paper-border);
      box-shadow: 0 24px 60px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #a57a32;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.82rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      color: #f9faf7;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 52%),
        linear-gradient(135deg, #5c8e86, #315a55);
      box-shadow: 0 12px 22px rgba(49, 90, 85, 0.2);
    }

    .button.secondary {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.4), transparent 58%),
        linear-gradient(135deg, #f1dfaa, #d7e6d4);
    }

    .viewer-frame {
      position: relative;
      min-height: 78vh;
      padding: 16px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.18)),
        repeating-linear-gradient(
          -45deg,
          rgba(127, 180, 188, 0.08) 0,
          rgba(127, 180, 188, 0.08) 14px,
          rgba(232, 199, 122, 0.07) 14px,
          rgba(232, 199, 122, 0.07) 28px
        );
      border: 1px solid rgba(127, 180, 188, 0.2);
    }

    .data-note {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) auto;
      gap: 16px;
      align-items: center;
      margin: 0 0 20px;
      padding: 18px 20px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(241, 223, 170, 0.2)),
        rgba(255, 255, 255, 0.34);
      border: 1px solid rgba(127, 180, 188, 0.22);
    }

    .data-note p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    iframe {
      display: block;
      width: 100%;
      height: 78vh;
      border: 0;
      border-radius: 18px;
      background: white;
      box-shadow: inset 0 0 0 1px rgba(36, 51, 48, 0.08);
    }

    @media (max-width: 820px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        justify-content: flex-start;
      }

      .shell {
        padding: 18px;
      }

      .data-note {
        grid-template-columns: 1fr;
      }

      .viewer-frame {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="shell">
      <div class="topbar">
        <div>
          <p class="eyebrow">Puzzle File</p>
          <h1>Field Reports</h1>
          <p class="subtitle">Bulletin and dataset for the Field Reports puzzle.</p>
        </div>
        <div class="actions">
          <a class="button secondary" href="index.html">Back to Hub</a>
          <a class="button" href="field_reports_bulletin_pdf.pdf" target="_blank" rel="noopener noreferrer">Open PDF Directly</a>
        </div>
      </div>

      <section class="data-note" aria-label="Field Reports dataset">
        <p>
          <code>field_reports.csv</code> is the data file for this puzzle.
        </p>
        <a class="button secondary" href="field_reports.csv">Open CSV</a>
      </section>

      <div class="viewer-frame">
        <iframe src="field_reports_bulletin_pdf.pdf" title="Field Reports PDF"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
