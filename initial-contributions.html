<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initial Contributions</title>
  <style>
    :root {
      --paper: rgba(255, 250, 244, 0.92);
      --paper-border: rgba(161, 111, 79, 0.18);
      --ink: #352720;
      --muted: #6c5850;
      --rose: #c88575;
      --peach: #efc7a8;
      --cream: #fff4db;
      --shadow: rgba(61, 40, 31, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.5), transparent 20%),
        radial-gradient(circle at 80% 12%, rgba(255, 244, 219, 0.82), transparent 18%),
        linear-gradient(180deg, #fff1ea 0%, #f8dfd1 44%, #e3c8b4 100%);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      padding: 28px 18px 22px;
      overflow: hidden;
    }

    .scene::before,
    .scene::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    .scene::before {
      left: -6vw;
      bottom: -4vh;
      width: 36vw;
      height: 28vh;
      background:
        radial-gradient(circle at 50% 100%, rgba(200, 133, 117, 0.45), transparent 58%),
        radial-gradient(circle at 30% 70%, rgba(239, 199, 168, 0.85), transparent 42%);
      filter: blur(4px);
    }

    .scene::after {
      right: -2vw;
      top: 10vh;
      width: 22vw;
      height: 22vw;
      min-width: 180px;
      min-height: 180px;
      border-radius: 38% 62% 57% 43% / 41% 43% 57% 59%;
      background: linear-gradient(135deg, rgba(255, 244, 219, 0.62), rgba(200, 133, 117, 0.2));
      transform: rotate(18deg);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 22px;
      border-radius: 30px;
      background: var(--paper);
      border: 1px solid var(--paper-border);
      box-shadow: 0 24px 60px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #b46f58;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.82rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      color: #fffdf9;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 52%),
        linear-gradient(135deg, #cf8c78, #9d6250);
      box-shadow: 0 12px 22px rgba(157, 98, 80, 0.2);
    }

    .button.secondary {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.45), transparent 58%),
        linear-gradient(135deg, #fff1d4, #f2d8c0);
    }

    .viewer-frame {
      min-height: 78vh;
      padding: 16px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.2)),
        radial-gradient(circle at top left, rgba(255, 244, 219, 0.35), transparent 30%),
        repeating-linear-gradient(
          45deg,
          rgba(200, 133, 117, 0.07) 0,
          rgba(200, 133, 117, 0.07) 12px,
          rgba(255, 255, 255, 0.08) 12px,
          rgba(255, 255, 255, 0.08) 24px
        );
      border: 1px solid rgba(200, 133, 117, 0.18);
    }

    iframe {
      display: block;
      width: 100%;
      height: 78vh;
      border: 0;
      border-radius: 18px;
      background: white;
      box-shadow: inset 0 0 0 1px rgba(53, 39, 32, 0.08);
    }

    @media (max-width: 820px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        justify-content: flex-start;
      }

      .shell {
        padding: 18px;
      }

      .viewer-frame {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="shell">
      <div class="topbar">
        <div>
          <p class="eyebrow">Puzzle File</p>
          <h1>Initial Contributions</h1>
          <p class="subtitle"></p>
        </div>
        <div class="actions">
          <a class="button secondary" href="index.html">Back to Hub</a>
          <a class="button" href="Initial%20Contributions%20Updated.pdf" target="_blank" rel="noopener noreferrer">Open PDF Directly</a>
        </div>
      </div>

      <div class="viewer-frame">
        <iframe src="Initial%20Contributions%20Updated.pdf" title="Initial Contributions PDF"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
